name: 'Vib Action'
description: 'Build Vib Image'
author: 'Vanilla OS Team'
branding:
  icon: 'arrow-up'
  color: 'yellow'
inputs:
  recipe:
    description: 'Path to recipe.yml'
    required: true
    default: 'recipe.yml'
  plugins:
    description: 'List of plugins to use'
    required: false
    default: ''
  output:
    description: 'Path to Containerfile'
    required: false
    default: 'Containerfile'

runs:
  using: 'composite'
  steps:
    - name: Run vib-action
      uses: vanilla-os/vib-action@1.1.0
